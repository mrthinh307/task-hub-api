# A generic, single database configuration.

[alembic]
# path to migration script directory
script_location = app/db/migrations

# template used to generate migration file names
# file_template = %%(rev)s_%%(slug)s

# sys.path path, inserted in sys.path if not already there
prepend_sys_path = .

# timezone to use when rendering the date within the migration file as well as the filename.
# string_value = UTC

# max length of characters to apply to the "slug" field
# truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow .pyc and .pyo files without
# a corresponding .py file to be treated as revisions
# sourceless = false

# version location specification; This defaults
# to app/db/migrations/versions. When using multiple version
# directories, initial revisions must be created with --version-path.
version_locations = app/db/migrations/versions

# set to 'true' to search source files recursively in version_locations
# recursive_version_locations = false

# the output encoding used when revision files are written from script.py.mako
output_encoding = utf-8

sqlalchemy.url = postgresql+asyncpg://task_hub:task_hub_dev_password@localhost:5432/task_hub

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
