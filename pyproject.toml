[project]
name = "task-hub-api"
version = "0.1.0"
description = "FastAPI Task Hub API with Layered Architecture, PostgreSQL 16 (NeonDB), SQLAlchemy 2.x async, Alembic, Pydantic v2, and Redis 7."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "redis>=5.0.0",
    "python-dotenv>=1.0.1",
    "passlib[bcrypt]>=1.7.4",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]




[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors: syntax and formatting rules (whitespace, line length, etc.)
    "W",   # pycodestyle warnings: style and convention warnings
    "F",   # Pyflakes: logic errors (undefined variables, unused imports, etc.)
    "I",   # isort: automatic sorting and grouping of import statements
    "UP",  # pyupgrade: syntax upgrades for modern Python features (Python 3.12+)
]




